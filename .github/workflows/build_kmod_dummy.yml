name: Build kmod-dummy Only for MzWrt RAX3000M
on:
  workflow_dispatch: # 仅支持手动点按钮运行，关闭定时，防止自动跑全量编译

env:
  TARGET: mediatek
  SUBTARGET: filogic
  PROFILE: cmcc_rax3000m
  IMAGE_NAME: MzWrt-mediatek-filogic-cmcc_rax3000m

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev gawk flex bison openssl libssl-dev dkms libelf-dev libudev-dev libpci-dev libiberty-dev autoconf git wget curl rsync unzip zstd

      # ========== 下面这一段【完全沿用原rax3000m-openwrt.yml的拉源码、打补丁、下载.config逻辑，保证vermagic一致】 ==========
      - name: Clone iStoreOS source & apply MzWrt patch
        run: |
          git clone --depth=1 https://github.com/istoreos/istoreos.git openwrt
          cd openwrt
          # 同步原版仓库的.config
          wget -O .config https://raw.githubusercontent.com/10you89-cell/mzwrt-openwrt/main/config/rax3000m.config
          # 应用MzWrt补丁脚本（和原版固件保持一致）
          bash ../patch.sh
      # =====================================================================================================

      - name: Feeds update & install
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Config prepare
        run: |
          cd openwrt
          make defconfig
          # 强制选中 kmod-dummy
          echo "CONFIG_PACKAGE_kmod-dummy=y" >> .config
          make olddefconfig

      - name: Compile only kmod-dummy
        run: |
          cd openwrt
          # 单独编译内核模块，不编译整机固件
          make package/kmod-dummy/compile -j$(nproc)

      - name: Collect ipk file
        run: |
          mkdir -p ./ipk_out
          find openwrt/bin/packages/aarch64_cortex-a53/ -name "kmod-dummy*.ipk" | xargs cp -t ./ipk_out/
          ls -lh ./ipk_out

      - name: Upload ipk to artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmod-dummy-rax3000m
          path: ./ipk_out/*.ipk
